<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="Animated terminal showing Eslam's production fleet status">
  <!-- Hand-built fleet console. SMIL-animated so it plays in a GitHub README
       with no JavaScript. Dark terminal card renders well on both themes. -->
  <defs>
    <style>
      .t  { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; }
      .cmd { fill: #c9d1d9; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .ok  { fill: #3fb950; }
      .dim { fill: #8b949e; }
      .title { fill: #8b949e; font-size: 12px; }
    </style>
  </defs>

  <!-- terminal card -->
  <rect x="1" y="1" width="858" height="248" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="1" y="1" width="858" height="34" rx="10" fill="#161b22"/>
  <rect x="1" y="25" width="858" height="10" fill="#161b22"/>
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="430" y="23" text-anchor="middle" class="t title">eslam@shousha-hub — fleet console</text>

  <!-- line 1: command -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.25s" fill="freeze"/>
    <text x="22" y="64" class="t"><tspan class="prompt">$</tspan><tspan class="cmd" dx="8">fleet status --all</tspan></text>
  </g>

  <!-- line 2: output -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.25s" fill="freeze"/>
    <text x="40" y="92" class="t"><tspan class="ok">✔ 15+ apps ONLINE</tspan><tspan class="dim" dx="14">·</tspan><tspan class="cmd" dx="14">0 open incidents</tspan><tspan class="dim" dx="14">·</tspan><tspan class="cmd" dx="14">backups: nightly</tspan><tspan class="ok" dx="8">✓</tspan></text>
  </g>

  <!-- line 3: command -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.25s" fill="freeze"/>
    <text x="22" y="122" class="t"><tspan class="prompt">$</tspan><tspan class="cmd" dx="8">npm test --everything</tspan></text>
  </g>

  <!-- line 4: output -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.25s" fill="freeze"/>
    <text x="40" y="150" class="t"><tspan class="ok">✓ 2,500+ tests passing</tspan><tspan class="dim" dx="10">across the fleet — money paths property-tested</tspan></text>
  </g>

  <!-- line 5: command -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.25s" fill="freeze"/>
    <text x="22" y="180" class="t"><tspan class="prompt">$</tspan><tspan class="cmd" dx="8">deploy shoushatv --channel firetv</tspan></text>
  </g>

  <!-- line 6: animated progress bar -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.2s" fill="freeze"/>
    <rect x="40" y="196" width="300" height="12" rx="6" fill="#21262d"/>
    <rect x="40" y="196" height="12" rx="6" fill="#3fb950" width="0">
      <animate attributeName="width" from="0" to="300" begin="4.2s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="0;300"/>
    </rect>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="5.6s" dur="0.2s" fill="freeze"/>
      <text x="352" y="207" class="t"><tspan class="ok">100%</tspan><tspan class="dim" dx="10">· versionCode auto-bumped · live on the TV</tspan></text>
    </g>
  </g>

  <!-- line 7: idle prompt + blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.1s" dur="0.2s" fill="freeze"/>
    <text x="22" y="236" class="t"><tspan class="prompt">$</tspan></text>
    <rect x="40" y="225" width="9" height="15" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="6.3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
